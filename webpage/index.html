<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Pokemon Battle Sim</title>
    </head>
    <body>
        <div class="pokemon_container" id="pokemon_a">
            <div class="pokemon_name">
                <h1>Clefairy</h1>
                <div class="health_container">
                    <div class="health_fill"></div>
                </div>
            </div>
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/35.png" alt="">
        </div>
        <div class="pokemon_container" id="pokemon_b">
            <div class="pokemon_name">
                <h1>Clefairy</h1>
                <div class="health_container">
                    <div class="health_fill"></div>
                </div>
            </div>
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/back/35.png" alt="">
        </div>
        <div class="battle_container">
            <div class="move_container">
                <div class="moves">
                    <div class="move">a</div>
                    <div class="move">b</div>
                    <div class="move">c</div>
                    <div class="move">d</div>
                </div>
            </div>
        </div>
    </body>
</html>
